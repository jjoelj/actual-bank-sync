<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Actual Bank Sync</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

<header>
  <div class="header-left">
    <span class="logo">⬡</span>
    <span class="header-title">Actual Bank Sync</span>
  </div>
  <div class="header-right">
    <button id="settings-btn" title="Settings">⚙</button>
    <button id="sync-btn" style="display:none">Sync Now</button>
  </div>
</header>

<div id="status-bar">Not synced yet</div>

<!-- Accounts view -->
<div id="accounts-view" style="display:none">
  <div id="sync-summary">
    <div id="summary-net-worth-row">
      <span class="summary-net-worth-label">Net worth</span>
      <div class="summary-net-worth-value-row">
        <span id="summary-net-worth"></span>
        <span id="summary-net-worth-delta"></span>
      </div>
    </div>
    <div class="summary-secondary">
      <div id="summary-accounts" class="summary-pill"></div>
      <div id="summary-transactions" class="summary-stat" style="display:none"></div>
      <div id="summary-next-alarm" class="summary-next-alarm"></div>
    </div>
  </div>

  <div id="sync-from-section" style="display:none">
    <span class="field-label">
      Start syncing from
      <span class="tooltip-icon" title="Applies to accounts that haven't synced yet. Already-synced accounts continue from where they left off.">ⓘ</span>
    </span>
    <input id="sync-from-date" type="date" />
  </div>

  <div id="accounts-list"></div>

  <div id="add-account-area">
    <button id="add-account-btn">+ Add account</button>
    <div id="account-type-dropdown"></div>
  </div>
</div>

<!-- Settings view -->
<div id="settings-view" style="display:none">
  <div class="field-group">
    <span class="field-label">Server URL</span>
    <input id="actual-url" type="url" placeholder="http://localhost:5006" />
  </div>
  <div class="field-group">
    <span class="field-label">Password</span>
    <input id="actual-password" type="password" placeholder="••••••••" />
  </div>
  <div class="settings-actions">
    <button id="connect-btn" class="btn btn-primary">Connect</button>
  </div>

  <div id="budget-fields" style="display:none">
    <div class="field-group">
      <span class="field-label">Sync ID</span>
      <input id="actual-sync-id" type="password" placeholder="abc-123" />
    </div>
    <div class="field-group">
      <span class="field-label">File Password (if encrypted)</span>
      <input id="actual-file-password" type="password" placeholder="leave blank if none" />
    </div>
    <div class="settings-actions">
      <button id="save-settings-btn" class="btn">Save Settings</button>
    </div>
  </div>
</div>

<script type="module" src="src/popup.js"></script>
</body>
</html>
